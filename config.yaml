# v2sub 运行配置（不含任何隐私信息，可以放心提交到仓库）
# 订阅链接请写进 sources.txt 或环境变量 V2SUB_SOURCES（Actions 里是 Secret SUBS）

# 只测自己的订阅。公开订阅源已清空 —— 要临时加回来，取消下面两行注释即可。
sources: []
#  - https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/v2ray/all_sub.txt
#  - https://cdn.jsdelivr.net/gh/MatinGhanbari/v2ray-configs@main/subscriptions/v2ray/all_sub.txt

settings:
  # 同时测几个节点。每个节点要起一个内核进程，CI 的 2 核机器 32 比较合适，
  # 本地 8 核可以到 48~64；再高会因为 CPU 抢占导致延迟虚高。
  concurrency: 32
  startup_timeout: 10.0
  fetch_timeout: 30

  # ---- TCP 预筛（上万节点的关键优化）----
  # 先用极低成本探一次端口，把连不上的节点直接判死，不为它们冷启动内核。
  # 只对 vmess/vless/trojan/ss 生效；hysteria2、tuic 走 UDP，不参与预筛。
  tcp_precheck: true
  precheck_timeout: 2.0
  precheck_concurrency: 200

  # ---- 真连接测试（等价于 V2RayN 的「真连接延迟」）----
  delay_test_url: https://www.gstatic.com/generate_204
  delay_timeout: 5
  delay_retries: 1
  accept_any_status: true
  accept_status: [200, 204, 301, 302]

  # ---- 测速 ----
  # 开启后每个节点会真的下载一段数据算 MB/s；min_speed_mbps 是下限，
  # require_speed: true 表示「测速没成功的一律不要」，避免速度未知的节点混进来。
  speed_test: true
  speed_test_url: https://cachefly.cachefly.net/10mb.test
  speed_timeout: 10
  # 只下前 2MB（用 HTTP Range），够算速度又省流量；0 = 下载完整文件
  speed_max_bytes: 2000000

  # ---- 筛选条件 ----
  max_delay_ms: 5000         # 0 = 不限制延迟，只要是通的就留
  min_speed_mbps: 2.0        # 速度低于 2 MB/s 的不要
  require_speed: true        # 必须测速成功才算可用
  max_nodes: 0               # >0 时只保留前 N 个（按速度降序），可用来压缩订阅体积
  protocols: [vmess, vless, trojan, ss, hysteria2, tuic]
  dedupe: true

  rename: true
  # {time} = 本轮筛选时间（MMDD-HHMM），一眼能看出是不是新结果
  rename_template: "{time}·{index:02d}·{delay}ms·{name}"
  core_dir: ./bin

output:
  dir: ./sub
  base64: base64.txt
  plain: nodes.txt
  report: report.json
  markdown: report.md
  include_links_in_report: false

github:
  enabled: true
  token_env: GITHUB_TOKEN
  mode: repo
  owner: "zppHappy"
  repo: "get-to-internet-by-own"
  path: sub/base64.txt
  branch: main
  commit_message: "chore: update filtered subscription"
  upload_plain: true
  plain_path: sub/nodes.txt
  # 人看的页面：GitHub 会把 .md 渲染成表格，跑完立刻能刷出新结果
  upload_markdown: true
  markdown_path: sub/report.md

  gist_id: ""
  gist_filename: sub.txt
  gist_description: v2sub filtered subscription
  gist_public: false
